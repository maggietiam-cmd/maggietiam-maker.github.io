<head>

<title>Maggie's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
/* Layout: one page, three views (cover, garden map, section page) switched by hash.
   Cover is asymmetric: text left, a line-drawn garden gate right that opens onto the flower photo.
   Palette comes from the chrysanthemum photo: blush white, petal pink, peach, centre-yellow. */
:root {
  --bg: #FFF7F5;
  --ink: #36292C;
  --muted: #7B6A6D;
  --line: #F0D8D8;
  --accent: #C0476A;
  --accent-text: #B03A5E;
  --on-accent: #FFFFFF;
  --pink-soft: #FBE1E5;
  --peach-soft: #FDE5D8;
  --butter: #D9A026;
  --butter-soft: #FBF0CB;
  --display: 'Cormorant Garamond', 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --body: 'Lato', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2A1B21; --ink: #FBEDEC; --muted: #CDB5B8; --line: #4A3239;
    --accent: #F08CA6; --accent-text: #F4A0B5; --on-accent: #2A1B21;
    --pink-soft: #432630; --peach-soft: #46291F; --butter: #F2C75C; --butter-soft: #443820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2A1B21; --ink: #FBEDEC; --muted: #CDB5B8; --line: #4A3239;
  --accent: #F08CA6; --accent-text: #F4A0B5; --on-accent: #2A1B21;
  --pink-soft: #432630; --peach-soft: #46291F; --butter: #F2C75C; --butter-soft: #443820;
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65; }
* { box-sizing: border-box; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

.wrap { max-width: 1080px; margin-inline: auto; padding-inline: 20px; padding-block: 20px 56px; }
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding-block: 8px 24px; }
.brand { font-family: var(--display); font-size: 1.4rem; font-weight: 600; text-decoration: none; }
.top-right { display: flex; align-items: center; gap: 16px; }
.issue { color: var(--muted); font-size: .85rem; }
.lang { display: inline-flex; border: 1.5px solid var(--accent); border-radius: 999px; overflow: hidden; }
.lang button { font: inherit; font-size: .85rem; font-weight: 700; padding: 3px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ---------- Cover ---------- */
.cover { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; min-height: 68vh; }
.cover h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: 1; margin: 0 0 8px; text-wrap: balance; }
.cover .zh-title { font-family: var(--display); font-size: 1.5rem; color: var(--accent-text); margin: 0 0 20px; }
.cover .lede { font-size: 1.1rem; color: var(--muted); max-width: 30em; margin: 0 0 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 13px 26px; border: 2px solid var(--accent); text-decoration: none; display: inline-block; }
.btn-main { background: var(--accent); color: var(--on-accent); }
.btn-main:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--pink-soft); }
.note { margin-top: 24px; padding: 18px 20px; background: var(--pink-soft); border-radius: 14px; max-width: 30em; }
.note p { margin: 0 0 10px; }
.note .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
.note code { font-family: var(--body); font-weight: 700; user-select: all; overflow-wrap: anywhere; }
.copy { font: inherit; font-size: .85rem; cursor: pointer; background: transparent; color: var(--ink); border: 1.5px solid var(--accent); border-radius: 999px; padding: 3px 14px; }
.copy:hover { background: var(--accent); color: var(--on-accent); }

.gate { width: 100%; max-width: 420px; justify-self: center; }
.gate svg { width: 100%; height: auto; display: block; overflow: visible; }
.door { transition: transform .8s cubic-bezier(.5,0,.2,1); transform-box: view-box; }
.door-l { transform-origin: 78px 0; }
.door-r { transform-origin: 242px 0; }
.gate.open .door-l, .gate.open .door-r { transform: scaleX(.08); }

/* ---------- Garden map ---------- */
.banner { height: 140px; border-radius: 18px; background-size: cover; background-position: center 40%; margin-bottom: 28px; }
.view-title { font-family: var(--display); font-weight: 600; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; margin: 0 0 4px; }
.zhname { font-family: var(--display); font-size: 1.25rem; color: var(--accent-text); margin: 0; }
.view-sub { color: var(--muted); margin: 12px 0 32px; max-width: 34em; }
.beds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; list-style: none; padding: 0; margin: 0; }
.bed { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 22px 20px 20px; border-radius: 16px; text-decoration: none; min-width: 0; transition: transform .2s; }
.bed:hover { transform: translateY(-4px); }
.bed .arch { width: 64px; height: 76px; border-radius: 32px 32px 8px 8px; display: grid; place-items: center; margin-bottom: 10px; background: var(--bg); color: var(--accent); }
.bed .arch svg { width: 40px; height: 40px; }
.bed h2 { font-family: var(--display); font-weight: 600; font-size: 1.7rem; line-height: 1.1; margin: 0; }
.bed .cv { font-weight: 700; font-size: .92rem; margin-top: 6px; }
.bed p { margin: 4px 0 0; font-size: .95rem; color: var(--muted); }
.tint-pink { background: var(--pink-soft); }
.tint-peach { background: var(--peach-soft); } .tint-peach .arch { color: #C9633F; }
.tint-butter { background: var(--butter-soft); } .tint-butter .arch { color: var(--butter); }
:root[data-theme="dark"] .tint-peach .arch { color: #F0A07F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tint-peach .arch { color: #F0A07F; } }

/* ---------- Section page ---------- */
.page { max-width: 720px; }
.crumb { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
.crumb a { color: var(--accent-text); font-weight: 700; }
.page h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: 1; margin: 0 0 4px; }
.page .cvname { font-size: 1.05rem; font-weight: 700; margin: 12px 0 20px; }
.page .blurb { font-family: var(--display); font-size: 1.65rem; line-height: 1.3; margin: 0 0 28px; }
.items { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.items li { padding: 16px 20px; border-radius: 14px; background: var(--pink-soft); }
.items li:nth-child(3n+2) { background: var(--peach-soft); }
.items li:nth-child(3n) { background: var(--butter-soft); }
.items .h { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; }
.items .d { font-weight: 400; color: var(--muted); font-size: .9rem; }
.items .t { margin: 2px 0 0; }
.draft { margin-top: 24px; color: var(--muted); font-size: .9rem; border-top: 1px dashed var(--line); padding-top: 14px; }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
.pager a { font-weight: 700; color: var(--accent-text); }

[hidden] { display: none !important; }
@media (max-width: 760px) {
  .cover { grid-template-columns: 1fr; min-height: 0; gap: 24px; }
  .gate { order: -1; max-width: 300px; }
  .beds { grid-template-columns: 1fr 1fr; gap: 14px; }
}
@media (max-width: 480px) { .beds { grid-template-columns: 1fr; } .banner { height: 110px; } }
@media (prefers-reduced-motion: reduce) { .door, .bed { transition: none; } }
</style>
</head>

var $ = function (id) { return document.getElementById(id); };
var views = { cover: $('v-cover'), map: $('v-map'), page: $('v-page') };
var lang = 'en';
try { lang = localStorage.getItem('mg-lang') || ''; } catch (e) {}
if (lang !== 'en' && lang !== 'zh') lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';

$('gphoto').setAttribute('href', PHOTO);
$('banner').style.backgroundImage = 'url(' + PHOTO + ')';

function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

function applyStatic() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = STR[el.getAttribute('data-t')][lang]; });
  $('copy').textContent = STR.copy[lang];
  $('l-en').setAttribute('aria-pressed', String(lang === 'en'));
  $('l-zh').setAttribute('aria-pressed', String(lang === 'zh'));
  $('beds').innerHTML = PAGES.map(function (p) {
    return '<li><a class="bed tint-' + p.tint + '" href="#' + p.id + '">' +
      '<span class="arch"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p.icon + '</svg></span>' +
      '<h2>' + esc(p.name.en) + '</h2><span class="zhname">' + esc(p.name.zh) + '</span>' +
      '<span class="cv">' + esc(p.cv[lang]) + '</span><p>' + esc(p.blurb[lang]) + '</p></a></li>';
  }).join('');
}

function show(name) {
  Object.keys(views).forEach(function (k) { views[k].hidden = (k !== name); });
}

function route(keepScroll) {
  var h = (location.hash || '#cover').slice(1);
  var idx = PAGES.findIndex(function (p) { return p.id === h; });
  if (!keepScroll) window.scrollTo(0, 0);
  if (h === 'map') { show('map'); document.title = 'The Garden Map · Maggie\'s Garden'; return; }
  if (idx >= 0) {
    var p = PAGES[idx], prev = PAGES[idx - 1], next = PAGES[idx + 1];
    views.page.innerHTML =
      '<div class="crumb"><a href="#map">' + esc(STR.crumb[lang]) + '</a> / ' + esc(p.cv[lang]) + '</div>' +
      '<h1>' + esc(p.name.en) + '</h1><p class="zhname">' + esc(p.name.zh) + '</p>' +
      '<p class="cvname">' + esc(p.cv[lang]) + '</p>' +
      '<p class="blurb">' + esc(p.blurb[lang]) + '</p>' +
      '<ul class="items">' + p.items.map(function (it) {
        var head = it.h ? '<div class="h"><span>' + esc(it.h[lang]) + '</span>' + (it.d ? '<span class="d">' + esc(it.d) + '</span>' : '') + '</div>' : '';
        return '<li>' + head + '<p class="t">' + esc(it[lang]) + '</p></li>';
      }).join('') + '</ul>' +
      '<p class="draft">' + esc(STR.draft[lang]) + '</p>' +
      '<div class="pager"><span>' + (prev ? '<a href="#' + prev.id + '">' + esc(STR.prev[lang] + prev.name.en) + '</a>' : '<a href="#map">' + esc(STR.back[lang]) + '</a>') + '</span>' +
      '<span>' + (next ? '<a href="#' + next.id + '">' + esc(STR.next[lang] + next.name.en) + '</a>' : '<a href="#map">' + esc(STR.back[lang]) + '</a>') + '</span></div>';
    show('page'); document.title = p.name.en + ' · Maggie\'s Garden'; return;
  }
  $('gate').classList.remove('open');
  show('cover'); document.title = "Maggie's Garden";
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('mg-lang', l); } catch (e) {}
  applyStatic(); route(true);
}
$('l-en').addEventListener('click', function () { setLang('en'); });
$('l-zh').addEventListener('click', function () { setLang('zh'); });

$('enter').addEventListener('click', function () {
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('gate').classList.add('open');
  setTimeout(function () { location.hash = 'map'; }, calm ? 0 : 750);
});
$('later').addEventListener('click', function () {
  var n = $('note'); n.hidden = !n.hidden;
  this.setAttribute('aria-expanded', String(!n.hidden));
});
$('copy').addEventListener('click', function () {
  var btn = this, text = 'tmanqin0311@163.com';
  function done() { btn.textContent = STR.copied[lang]; setTimeout(function () { btn.textContent = STR.copy[lang]; }, 1500); }
  function fail() { btn.textContent = STR.copyFail[lang]; }
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
});
window.addEventListener('hashchange', function () { route(false); });
applyStatic();
route(false);
</script>
